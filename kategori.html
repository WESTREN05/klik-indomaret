<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b3f8f">
  <meta name="description" content="Katalog produk Klik Indomaret — kebutuhan dapur, sembako, minuman, dan perawatan diri.">
  <title>Kategori — Klik Indomaret</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b3f8f'/%3E%3Cpath d='M20 24h24l2 26H18l2-26Z' fill='%23fff'/%3E%3Cpath d='M26 24a6 6 0 0 1 12 0' stroke='%23fff' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="kategori" data-header="main" data-active="kategori">
  <div class="app">
    <div id="appHeader"></div>

    <main>
      <section class="page-head">
        <div class="page-head__pad">
          <button class="address-card js-open-address" type="button">
            <span class="address-card__pin" data-icon="pin"></span>
            <span class="address-card__body">
              <small>Dikirim ke:</small>
              <strong class="js-address-text">Jl. Kebon Jeruk No. 12, Jakarta Barat</strong>
            </span>
            <span class="address-card__change">Ubah <span data-icon="chevronDown"></span></span>
          </button>
        </div>

        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="index.html">Beranda</a>
          <span data-icon="chevronRight"></span>
          <span id="crumbCurrent">Kategori</span>
        </nav>

        <div class="cat-head">
          <div>
            <h1 id="catTitle">Kebutuhan Dapur &amp; Sembako</h1>
            <p id="catSubtitle">Memuat produk...</p>
          </div>
          <span class="eta-badge"><span data-icon="clock"></span> 1 Jam Sampai</span>
        </div>

        <div class="cat-chips">
          <div class="chip-row" id="catChips" role="group" aria-label="Filter kategori"></div>
        </div>
      </section>

      <div class="toolbar">
        <button class="tool-btn" type="button" id="sortBtn">
          <span data-icon="sort"></span>
          <span id="sortLabel">Terpopuler</span>
          <span data-icon="chevronDown"></span>
        </button>
        <button class="tool-btn" type="button" id="promoToggle"><span aria-hidden="true">🔥</span> Promo JSM</button>
        <button class="tool-btn" type="button" id="readyToggle"><span data-icon="check"></span> Ready di Toko</button>
        <button class="tool-btn tool-btn--icon" type="button" id="filterBtn" aria-label="Filter harga">
          <span data-icon="filter"></span>
        </button>
      </div>

      <div class="product-grid" id="productGrid"></div>

      <div class="freeship">
        <span class="freeship__icon" data-icon="truck"></span>
        <div>
          <strong>Gratis Ongkir s.d. Rp 10.000</strong>
          <p>Min. belanja Rp 50.000 di toko <span class="js-store-name">Indomaret Kemanggi 2</span></p>
        </div>
        <span data-icon="chevronRight"></span>
      </div>
    </main>

    <div class="cartbar" id="cartBar" hidden>
      <div class="cartbar__inner">
        <span class="cartbar__icon">
          <span data-icon="cart"></span>
          <span class="cartbar__badge js-cart-count">0</span>
        </span>
        <span class="cartbar__text">
          <small>Total Belanja Anda</small>
          <strong class="js-cart-total">Rp 0</strong>
        </span>
        <a class="btn" href="keranjang.html">Lihat Keranjang <span data-icon="arrowRight"></span></a>
      </div>
    </div>

    <div id="appNav"></div>
  </div>

  <div class="toasts" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/products.js"></script>
  <script src="js/core.js"></script>
  <script src="js/session.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/app.js"></script>
  <script src="js/kategori.js"></script>
</body>
</html>
